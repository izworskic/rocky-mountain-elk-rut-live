name: Refresh Elk Rut Live Snapshot

on:
  push:
    branches: [main]
    paths:
      - "api/live.js"
      - "scripts/snapshot-live.mjs"
      - ".github/workflows/refresh-live.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elk-rut-live-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate live snapshot
        run: node scripts/snapshot-live.mjs

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live.json
          if git diff --cached --quiet; then
            echo "No snapshot change to commit"
            exit 0
          fi
          git commit -m "Refresh elk rut live snapshot"
          git push
