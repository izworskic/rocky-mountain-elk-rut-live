name: Elk Rut Devils Advocate Upgrade

on:
  push:
    branches: [improve/elk-devils-advocate]
    paths:
      - ".github/workflows/devils-advocate-upgrade.yml"
      - "scripts/apply-elk-devils-advocate.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/elk-devils-advocate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply upgrades
        run: node scripts/apply-elk-devils-advocate.mjs
      - name: Verify
        run: npm run verify
      - name: Commit verified changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/live.js tests/elk-rut.test.js public/national-tools/elk-rut/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Improve elk rut decisions and trust"
            git push origin HEAD:improve/elk-devils-advocate
          fi
